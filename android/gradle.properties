org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9.0 made Kotlin support built-in (default KGP 2.2.10, no `android { kotlin {} }` config
# surface yet). We pin an explicit, newer Kotlin version via the version catalog instead, which
# requires opting back into applying org.jetbrains.kotlin.android explicitly. Documented supported
# until AGP 10 (mid-2026): https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.builtInKotlin=false
# The old DSL is also required for the externally-applied Kotlin plugin to coexist with AGP 9's
# new extension type; see the AGP 9.0 release notes linked above.
android.newDsl=false
