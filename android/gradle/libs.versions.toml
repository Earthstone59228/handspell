# Version catalog for the Handspell Android app.
#
# Every coordinate below was checked against its live maven-metadata.xml on 2026-09-13 before being
# pinned here (docs/QUALITY.md §5 — "no recalled versions"). No alphas/betas/RCs unless noted.
#
# Verification URLs (fetched 2026-09-13):
#   AGP                         https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml
#                                -> latest non-prerelease is 9.4.0 (9.5.0-alpha05 is newer but alpha).
#                                AGP 9.4 release notes (developer.android.com/build/releases/gradle-plugin)
#                                state min/default Gradle 9.6.0 and max compileSdk 37. compileSdk/
#                                targetSdk are 37 here (bumped up from the 36 originally specified;
#                                see the comment on `compileSdk` in app/build.gradle.kts for why) —
#                                still within AGP 9.4.0's supported range. Gradle wrapper pinned to
#                                9.7.1 (current stable, https://services.gradle.org/versions/current),
#                                which satisfies that floor.
#   Kotlin                      https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml
#                                -> latest stable 2.4.20.
#   Compose compiler / BOM      https://dl.google.com/dl/android/maven2/androidx/compose/compose-bom/maven-metadata.xml
#                                -> latest stable 2026.09.00. The Compose compiler is the Kotlin
#                                   `org.jetbrains.kotlin.plugin.compose` plugin, versioned with Kotlin itself.
#   kotlinx-serialization plugin -> versioned with Kotlin itself (org.jetbrains.kotlin.plugin.serialization).
#   activity-compose            https://dl.google.com/dl/android/maven2/androidx/activity/activity-compose/maven-metadata.xml
#                                -> latest stable 1.13.0 (1.14.0-alpha02 is alpha, skipped).
#   lifecycle-viewmodel/runtime-compose
#                                https://dl.google.com/dl/android/maven2/androidx/lifecycle/lifecycle-viewmodel-compose/maven-metadata.xml
#                                https://dl.google.com/dl/android/maven2/androidx/lifecycle/lifecycle-runtime-compose/maven-metadata.xml
#                                -> latest stable 2.11.0 (2.12.0-alpha03 is alpha, skipped).
#   navigation-compose          https://dl.google.com/dl/android/maven2/androidx/navigation/navigation-compose/maven-metadata.xml
#                                -> latest stable 2.10.1.
#   CameraX (core/camera2/lifecycle/view)
#                                https://dl.google.com/dl/android/maven2/androidx/camera/camera-core/maven-metadata.xml (+ camera2, lifecycle, view)
#                                -> latest stable 1.6.2 (1.7.0-alpha03 is alpha, skipped).
#   MediaPipe tasks-vision       https://dl.google.com/dl/android/maven2/com/google/mediapipe/tasks-vision/maven-metadata.xml
#                                -> latest 1.0.0, stable, Google's Maven only (NOT Maven Central; see
#                                   docs/research/mediapipe.md §1).
#   RevenueCat purchases         https://repo.maven.apache.org/maven2/com/revenuecat/purchases/purchases/maven-metadata.xml
#                                -> latest stable 10.21.1 (10.22.0-alpha.01 is alpha, skipped); see
#                                   docs/research/revenuecat.md §1. purchases-ui is intentionally not
#                                   used: the paywall is our own Compose screen over
#                                   Purchases.getOfferings()/purchase()/restorePurchases()
#                                   (docs/ARCHITECTURE.md §9, docs/CONTRACTS.md §5).
#   datastore-preferences        https://dl.google.com/dl/android/maven2/androidx/datastore/datastore-preferences/maven-metadata.xml
#                                -> latest stable 1.2.1 (1.3.0-alphaNN is alpha, skipped).
#   kotlinx-serialization-json   https://repo.maven.apache.org/maven2/org/jetbrains/kotlinx/kotlinx-serialization-json/maven-metadata.xml
#                                -> latest stable 1.11.0 (1.12.0-RC skipped).
#   kotlinx-coroutines (android/test)
#                                https://repo.maven.apache.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-android/maven-metadata.xml
#                                https://repo.maven.apache.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-test/maven-metadata.xml
#                                -> latest stable 1.11.0.
#   JUnit4                       https://repo.maven.apache.org/maven2/junit/junit/maven-metadata.xml -> 4.13.2.
#   androidx test runner         https://dl.google.com/dl/android/maven2/androidx/test/runner/maven-metadata.xml -> 1.7.0.
#   core-ktx                     https://dl.google.com/dl/android/maven2/androidx/core/core-ktx/maven-metadata.xml -> 1.19.0.

[versions]
agp = "9.4.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.1"
cameraX = "1.6.2"
mediapipeTasksVision = "1.0.0"
revenuecat = "10.21.1"
datastorePreferences = "1.2.1"
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.11.0"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
coreKtx = "1.19.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraX" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }

mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasksVision" }

revenuecat-purchases = { group = "com.revenuecat.purchases", name = "purchases", version.ref = "revenuecat" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
