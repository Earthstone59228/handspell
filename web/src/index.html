<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1D1D1F" />
  <title>ASL Alphabet</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-close" viewBox="0 0 32 32"><path d="M8 8 24 24M24 8 8 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="icon-back" viewBox="0 0 32 32"><path d="M19.5 6.5 10 16l9.5 9.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>
  <div class="app-shell">
    <header class="top-area">
      <div class="top-line">
        <h1>Alphabet</h1>
        <div class="header-icons">
          <button class="header-icon" id="open-settings" type="button" aria-label="Open settings">
            <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><g transform="translate(0 -1.5)"><path d="M13.6 3.5h4.8l.6 3.1c.8.3 1.5.6 2.1 1l2.8-1.5 3.4 3.4-1.5 2.8c.4.6.7 1.3 1 2.1l3.1.6v4.8l-3.1.6c-.3.8-.6 1.5-1 2.1l1.5 2.8-3.4 3.4-2.8-1.5c-.6.4-1.3.7-2.1 1l-.6 3.1h-4.8l-.6-3.1c-.8-.3-1.5-.6-2.1-1l-2.8 1.5-3.4-3.4 1.5-2.8c-.4-.6-.7-1.3-1-2.1l-3.1-.6V15l3.1-.6c.3-.8.6-1.5 1-2.1L4.7 9.5l3.4-3.4 2.8 1.5c.6-.4 1.3-.7 2.1-1l.6-3.1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="16" cy="17.4" r="4.1" stroke="currentColor" stroke-width="1.8"/></g></svg>
          </button>
          <button class="header-icon" id="open-paper" type="button" aria-label="Open paper">
            <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 3.5h11.2L25 9.3v19.2H8V3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M19.2 3.5v5.8H25M12 14h9M12 18h9M12 22h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="progress-line"><span id="completion-count" aria-live="polite">0 / 26</span><button class="streak-chip" id="open-progress" type="button" hidden></button><span id="save-error" role="alert" hidden>Progress could not be saved</span></div>
    </header>
    <main class="letter-scroll" id="letter-scroll" aria-label="ASL letter cards"><div class="letter-list" id="letter-list"></div></main>
    <nav class="alphabet-index" id="alphabet-index" aria-label="Jump to a letter"></nav>
  </div>
  <div class="modal-backdrop" id="practice-modal" hidden>
    <section class="practice-sheet" role="dialog" aria-modal="true" aria-labelledby="practice-title">
      <button class="nav-control sheet-close" id="close-practice" type="button" aria-label="Close practice view"><svg aria-hidden="true"><use href="#icon-close"></use></svg></button>
      <div class="practice-letter" id="practice-letter" aria-hidden="true">A</div>
      <h2 id="practice-title">Letter A</h2>
      <div class="sheet-actions">
        <button class="practice-button" id="start-practice" type="button">Practice</button>
        <button class="complete-button" id="complete-practice" type="button">Mark practice</button>
      </div>
      <button class="undo-button" id="undo-completion" type="button" hidden>Undo completion</button>
    </section>
  </div>
  <section class="setup-screen" id="setup-screen" role="dialog" aria-modal="true" aria-labelledby="setup-title" hidden>
    <button class="nav-control screen-back" id="close-setup" type="button" aria-label="Back to alphabet"><svg aria-hidden="true"><use href="#icon-back"></use></svg></button>
    <div class="setup-content">
      <div class="setup-visual" aria-hidden="true">
        <iframe id="phone-animation" title="Phone on a stand animation" sandbox="allow-scripts" tabindex="-1"></iframe>
      </div>
      <h2 id="setup-title">Find a place to lean your phone against.</h2>
      <button class="setup-confirm" id="confirm-setup" type="button">Confirm</button>
    </div>
  </section>
  <section class="utility-screen" id="next-screen" role="dialog" aria-modal="true" aria-label="Practice screen" hidden>
    <button class="nav-control screen-back" id="back-next" type="button" aria-label="Back to alphabet"><svg aria-hidden="true"><use href="#icon-back"></use></svg></button>
  </section>
  <section class="utility-screen" id="utility-screen" role="dialog" aria-modal="true" aria-label="Blank menu" hidden>
    <button class="nav-control screen-back" id="utility-back" type="button" aria-label="Back to alphabet"><svg aria-hidden="true"><use href="#icon-back"></use></svg></button>
  </section>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
